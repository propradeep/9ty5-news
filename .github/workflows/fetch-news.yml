name: Fetch news

on:
  schedule:
    # GitHub delays or drops some scheduled runs, so trigger every 15 minutes; the script skips
    # a run when the data is already fresh (see SKIP_IF_YOUNGER_MIN), giving about 30 minutes.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch news
        env:
          SKIP_IF_YOUNGER_MIN: ${{ github.event_name == 'schedule' && '20' || '0' }}
        run: python scripts/fetch_news.py

      - name: Commit updated data
        run: |
          git config user.name  "9ty5-news-bot"
          git config user.email "9ty5-news-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update news data [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
