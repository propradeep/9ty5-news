name: Fetch news

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch RSS, Reddit and X
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          # e.g. https://your-rsshub.example.com/twitter/user/{handle}
          X_FEED_TEMPLATE: ${{ vars.X_FEED_TEMPLATE }}
        run: python scripts/fetch_news.py

      - name: Commit updated data
        run: |
          git config user.name  "9ty5-news-bot"
          git config user.email "9ty5-news-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update news data [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
