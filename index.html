<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>9ty5 News — Anime · Manga · Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0f0f13; --bg2:#16161d; --bg3:#1e1e2a; --bg4:#252535;
  --accent:#5855d6; --accent2:#7b78f0; --text:#e8e8f0; --dim:#888899;
  --green:#4ade80; --yellow:#fbbf24; --orange:#fb923c; --red:#f87171;
  --border:#2a2a3a; --c-anime:#5855d6; --c-manga:#d97706; --c-gaming:#16a34a;
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 15px; line-height: 1.5; min-height: 100dvh; overflow-x: hidden;
}

/* TOPBAR */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,15,19,0.96); backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center;
  justify-content: space-between; gap: 10px;
}
.logo { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700;
  color: var(--accent2); white-space: nowrap; flex-shrink: 0; }
.logo span { color: var(--dim); font-weight: 400; font-size: 12px; }
.topbar-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.icon-btn {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  color: var(--dim); font-size: 17px; width: 36px; height: 36px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.icon-btn:hover { background: var(--bg4); color: var(--text); }
.refresh-btn {
  background: var(--accent); color: #fff; border: none; border-radius: 8px;
  padding: 8px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px;
  font-weight: 700; cursor: pointer; display: flex; align-items: center;
  gap: 6px; white-space: nowrap; transition: background .15s;
}
.refresh-btn:hover { background: var(--accent2); }
.refresh-btn:disabled { background: var(--bg3); color: var(--dim); cursor: not-allowed; }
.spin { animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* MODE TABS */
.mode-row {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; overflow-x: auto; scrollbar-width: none;
}
.mode-row::-webkit-scrollbar { display: none; }
.mode-btn {
  background: none; border: none; color: var(--dim);
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  padding: 10px 18px; cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
}
.mode-btn.active-rss    { color: var(--accent2); border-color: var(--accent); }
.mode-btn.active-chapters { color: var(--accent2); border-color: var(--accent2); }
.mode-btn.active-releases { color: var(--green, #3ecf8e); border-color: var(--green, #3ecf8e); }
.mode-btn.active-official { color: var(--text, #e8e8f0); border-color: var(--text, #e8e8f0); }
.health { display:none; margin: 0 12px 6px; padding: 8px 10px; border-radius: 8px; font-size: 12px;
  background: rgba(255,170,0,.12); border: 1px solid rgba(255,170,0,.4); color: #ffb84d; cursor: pointer; }
.health.show { display:block; }
.health.bad { background: rgba(255,80,80,.12); border-color: rgba(255,80,80,.45); color: #ff7a7a; }
.health ul { margin: 6px 0 0 16px; padding: 0; display:none; }
.health.open ul { display:block; }
.health li { margin: 2px 0; word-break: break-word; }

/* SEARCH */
.search-row {
  padding: 8px 16px 6px; display: flex; gap: 8px; align-items: center;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.search-wrap { flex: 1; position: relative; }
.search-wrap .sicon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--dim); font-size: 14px; pointer-events: none;
}
.search-input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 14px; padding: 7px 12px 7px 32px; outline: none; transition: border-color .15s;
}
.search-input:focus { border-color: var(--accent); }
.count-badge {
  background: var(--bg3); color: var(--dim); font-size: 12px;
  padding: 4px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}

/* CAT TABS */
.cat-row {
  display: flex; overflow-x: auto; scrollbar-width: none;
  background: var(--bg2); border-bottom: 1px solid var(--border);
}
.cat-row::-webkit-scrollbar { display: none; }
.cat-btn {
  background: none; border: none; color: var(--dim);
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  padding: 8px 14px; cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
  display: flex; align-items: center; gap: 4px;
}
.cat-btn.active { color: var(--accent2); border-color: var(--accent); font-weight: 600; }
.cat-count {
  font-size: 10px; background: var(--bg3); color: var(--dim);
  border-radius: 10px; padding: 1px 5px; min-width: 18px; text-align: center;
}
.cat-btn.active .cat-count { background: var(--accent); color: #fff; }
.fav-cat-btn { margin-left: auto; color: var(--yellow) !important; }
.fav-cat-btn.active { border-color: var(--yellow) !important; }
.fav-cat-btn.active .cat-count { background: var(--yellow) !important; color: #000 !important; }

/* STATUS */
.progress-bar { height: 2px; background: var(--bg3); overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
.progress-fill.indeterminate { width: 40%; animation: indeterminate 1.2s ease-in-out infinite; }
@keyframes indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
.status-row {
  display: flex; align-items: center; background: var(--bg2);
  border-bottom: 1px solid var(--border); min-height: 28px; gap: 6px; padding: 0 8px 0 16px;
}
.status-bar { flex: 1; padding: 5px 0; font-size: 11px; color: var(--dim); }
.status-bar .err { color: var(--red); }
.status-bar .ok  { color: var(--green); }
.auto-badge {
  font-size: 10px; color: var(--green); background: rgba(74,222,128,0.1);
  border-radius: 4px; padding: 2px 6px; white-space: nowrap; flex-shrink: 0;
}
.mark-read-btn {
  background: none; border: none; color: var(--dim); font-size: 11px;
  cursor: pointer; padding: 4px 6px; border-radius: 4px;
  white-space: nowrap; transition: color .15s; flex-shrink: 0;
}
.mark-read-btn:hover { color: var(--text); }

/* CARDS */
#articles { padding: 0; max-width: 900px; margin: 0 auto; }
.card {
  padding: 12px 16px 10px; border-bottom: 1px solid var(--border);
  transition: background .1s; cursor: pointer;
}
.card:nth-child(even) { background: var(--bg2); }
.card:hover { background: var(--bg3); }
.card.is-read { opacity: 0.38; }
.card-inner { display: flex; gap: 10px; }
.card-thumb {
  width: 68px; height: 68px; object-fit: cover;
  border-radius: 6px; flex-shrink: 0; background: var(--bg3);
}
.card-body { flex: 1; min-width: 0; }
.card-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-bottom: 4px; }
.source-tag {
  display: inline-block; padding: 2px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 700; color: #fff; letter-spacing: 0.02em; flex-shrink: 0;
}
.tag-anime  { background: var(--c-anime); }
.tag-manga  { background: var(--c-manga); }
.tag-gaming { background: var(--c-gaming); }
.new-badge {
  font-size: 9px; font-weight: 700; color: var(--green);
  background: rgba(74,222,128,0.12); padding: 1px 5px; border-radius: 4px;
  letter-spacing: 0.05em; flex-shrink: 0;
}
.tag-flair {
  font-size: 10px; color: var(--dim); background: var(--bg3);
  padding: 2px 6px; border-radius: 4px;
  max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-age { font-size: 11px; color: var(--dim); margin-left: auto; flex-shrink: 0; }
.read-dot  { font-size: 10px; color: #444; flex-shrink: 0; }
.card-title {
  font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600;
  color: var(--text); line-height: 1.4; margin-bottom: 3px; word-break: break-word;
}
.card:hover .card-title { color: var(--accent2); }
.card-summary {
  font-size: 12px; color: var(--dim); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; margin-bottom: 6px;
}
.card-actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
.action-btn {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
  color: var(--dim); font-size: 11px; font-weight: 500; padding: 3px 9px;
  cursor: pointer; transition: all .15s; display: flex; align-items: center;
  gap: 3px; text-decoration: none;
}
.action-btn:hover { background: var(--bg4); color: var(--text); border-color: var(--accent); }
.action-btn.fav-active { color: var(--yellow); border-color: var(--yellow); }

/* LOAD MORE */
.load-more-wrap { padding: 20px; text-align: center; max-width: 900px; margin: 0 auto; }
.load-more-btn {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px;
  font-weight: 500; padding: 10px 28px; cursor: pointer; transition: all .15s;
}
.load-more-btn:hover { background: var(--bg4); border-color: var(--accent); }

/* EMPTY */
.empty { padding: 60px 20px; text-align: center; color: var(--dim); }
.empty .big { font-size: 40px; margin-bottom: 12px; }
.empty p { font-size: 14px; line-height: 1.8; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg4); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 13px; padding: 10px 20px; z-index: 9999;
  transition: transform .25s ease; white-space: nowrap; box-shadow: 0 4px 24px rgba(0,0,0,.5);
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* SETTINGS */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 200; display: none; backdrop-filter: blur(4px);
}
.overlay.open { display: block; }
.settings-panel {
  position: fixed; bottom: 0; left: 0; right: 0; max-width: 540px; margin: 0 auto;
  background: var(--bg2); border-radius: 16px 16px 0 0;
  border: 1px solid var(--border); border-bottom: none;
  padding: 0 20px 40px; z-index: 201;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
  max-height: 90vh; overflow-y: auto;
}
.settings-panel.open { transform: translateY(0); }
.s-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 16px; }
.s-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 20px; color: var(--text); }
.s-section { margin-bottom: 22px; }
.s-label { font-size: 11px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.s-opts { display: flex; gap: 8px; flex-wrap: wrap; }
.s-opt {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  color: var(--dim); font-size: 13px; padding: 6px 14px; cursor: pointer; transition: all .15s;
}
.s-opt.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.toggle-row:last-child { border-bottom: none; }
.toggle-label { font-size: 14px; color: var(--text); }
.toggle-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
.toggle {
  width: 44px; height: 24px; background: var(--bg3); border-radius: 12px;
  border: none; cursor: pointer; position: relative; flex-shrink: 0; transition: background .2s;
}
.toggle::after {
  content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px;
  background: var(--dim); border-radius: 50%; transition: transform .2s, background .2s;
}
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(20px); background: #fff; }

.danger-btn {
  width: 100%; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25);
  border-radius: 8px; color: var(--red); font-size: 13px; padding: 10px;
  cursor: pointer; margin-top: 8px; transition: all .15s;
}
.danger-btn:hover { background: rgba(248,113,113,0.16); }

/* PWA BANNER */
.install-banner {
  display: none; background: var(--accent); color: #fff;
  padding: 10px 16px; font-size: 13px;
  align-items: center; justify-content: space-between; gap: 10px;
}
.install-banner.show { display: flex; }
.install-banner button {
  background: #fff; color: var(--accent); border: none; border-radius: 6px;
  padding: 5px 12px; font-weight: 700; cursor: pointer; font-size: 12px; flex-shrink: 0;
}

/* SCROLL TOP */
.scroll-top {
  position: fixed; bottom: 20px; right: 16px; background: var(--accent);
  color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px;
  font-size: 18px; cursor: pointer; opacity: 0; pointer-events: none;
  transition: opacity .2s; z-index: 50; display: flex; align-items: center;
  justify-content: center; box-shadow: 0 2px 12px rgba(88,85,214,0.4);
}
.scroll-top.visible { opacity: 1; pointer-events: auto; }

@media (max-width: 480px) {
  .logo span { display: none; }
  .card-title { font-size: 13px; }
  .card { padding: 10px 12px 8px; }
  .card-thumb { width: 56px; height: 56px; }
  .refresh-btn { padding: 8px 10px; font-size: 13px; }
}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

<div class="install-banner" id="installBanner">
  📱 Add to Home Screen for offline access
  <button onclick="installPWA()">Install</button>
  <button style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)"
          onclick="document.getElementById('installBanner').classList.remove('show')">✕</button>
</div>

<div class="topbar">
  <div class="logo">📡 9ty5 News <span>Anime · Manga · Gaming</span></div>
  <div class="topbar-right">
    <button class="icon-btn" onclick="openSettings()" title="Settings">⚙</button>
    <button class="refresh-btn" id="refreshBtn" onclick="fetchCurrent()">
      <span id="refreshIcon">⟳</span> Refresh
    </button>
  </div>
</div>

<div class="mode-row">
  <button class="mode-btn active-rss" id="modeRss" onclick="switchMode('rss')">📰 RSS News</button>
  <button class="mode-btn" id="modeX" onclick="switchMode('official')">⭐ Official</button>
  <button class="mode-btn" id="modeReleases" onclick="switchMode('releases')">🆕 Releases</button>
  <button class="mode-btn" id="modeChapters" onclick="switchMode('chapters')">📖 Chapters</button>
</div>

<div class="search-row">
  <div class="search-wrap">
    <span class="sicon">🔍</span>
    <input class="search-input" type="search" id="searchInput"
           placeholder="Search articles…" oninput="applyFilter()" autocomplete="off">
  </div>
  <div class="count-badge" id="countBadge">0</div>
</div>

<div class="cat-row">
  <button class="cat-btn active" data-cat="all" onclick="switchCat(this,'all')">
    🌐 All <span class="cat-count" id="cnt-all"></span>
  </button>
  <button class="cat-btn" data-cat="anime" onclick="switchCat(this,'anime')">
    🎌 Anime <span class="cat-count" id="cnt-anime"></span>
  </button>
  <button class="cat-btn" data-cat="manga" onclick="switchCat(this,'manga')">
    📚 Manga <span class="cat-count" id="cnt-manga"></span>
  </button>
  <button class="cat-btn" data-cat="gaming" onclick="switchCat(this,'gaming')">
    🎮 Gaming <span class="cat-count" id="cnt-gaming"></span>
  </button>
  <button class="cat-btn fav-cat-btn" data-cat="fav" onclick="switchCat(this,'fav')">
    ⭐ Saved <span class="cat-count" id="cnt-fav"></span>
  </button>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="status-row">
  <div class="status-bar" id="statusBar">Ready — tap Refresh</div>
  <span class="auto-badge" id="autoBadge" style="display:none"></span>
  <button class="mark-read-btn" onclick="markAllRead()">✓ Mark all read</button>
</div>
<div class="health" id="health" onclick="this.classList.toggle('open')"></div>

<div id="articles"></div>
<div class="load-more-wrap" id="loadMoreWrap" style="display:none">
  <button class="load-more-btn" onclick="loadMore()">Load More</button>
</div>

<!-- Settings -->
<div class="overlay" id="settingsOverlay" onclick="closeSettings()"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="s-handle"></div>
  <div class="s-title">⚙ Settings</div>

  <div class="s-section">
    <div class="s-label">Auto-refresh</div>
    <div class="s-opts" id="arOpts">
      <button class="s-opt" onclick="setAutoRefresh(0,this)">Off</button>
      <button class="s-opt" onclick="setAutoRefresh(5,this)">5 min</button>
      <button class="s-opt" onclick="setAutoRefresh(15,this)">15 min</button>
      <button class="s-opt" onclick="setAutoRefresh(30,this)">30 min</button>
    </div>
  </div>

  <div class="s-section">
    <div class="s-label">Articles per source</div>
    <div class="s-opts" id="pfOpts">
      <button class="s-opt" onclick="setPerFeed(5,this)">5</button>
      <button class="s-opt" onclick="setPerFeed(8,this)">8</button>
      <button class="s-opt" onclick="setPerFeed(12,this)">12</button>
    </div>
  </div>

  <div class="s-section">
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Hide read articles</div>
        <div class="toggle-sub">Filter out articles you've already opened</div>
      </div>
      <button class="toggle" id="hideReadToggle" onclick="toggleSetting('hideRead')"></button>
    </div>
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Show thumbnails</div>
        <div class="toggle-sub">Display images when available</div>
      </div>
      <button class="toggle on" id="thumbToggle" onclick="toggleSetting('showThumbs')"></button>
    </div>
  </div>

  <div class="s-section">
    <div class="s-label">Data</div>
    <button class="danger-btn" onclick="clearCache()">🗑 Clear all cache &amp; saved data</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<button class="scroll-top" id="scrollTop"
        onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
let mode='rss', cat='all';
let allArticles=[], filteredPool=[], visibleCount=30;
const PAGE_SIZE=30;
let favorites   = JSON.parse(localStorage.getItem('9ty5_favs')||'[]');
let readLinks   = new Set(JSON.parse(localStorage.getItem('9ty5_read')||'[]'));
let isFetching  = false, deferredInstall=null, arTimer=null;
let cfg = { autoRefresh:15, perFeed:8, hideRead:false, showThumbs:true,
            ...JSON.parse(localStorage.getItem('9ty5_cfg')||'{}') };

// ── PWA ───────────────────────────────────────────────────────────────────────
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstall=e;
  document.getElementById('installBanner').classList.add('show');
});
function installPWA() {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.then(()=>{ deferredInstall=null; document.getElementById('installBanner').classList.remove('show'); });
}
window.addEventListener('scroll',()=>{
  document.getElementById('scrollTop').classList.toggle('visible',window.scrollY>400);
});

// ── HELPERS ───────────────────────────────────────────────────────────────────
function timeAgo(d) {
  if (!d) return '';
  try {
    const s=(Date.now()-new Date(d).getTime())/1000;
    if(s<60)    return 'just now';
    if(s<3600)  return `${Math.floor(s/60)}m ago`;
    if(s<86400) return `${Math.floor(s/3600)}h ago`;
    if(s<604800)return `${Math.floor(s/86400)}d ago`;
    return new Date(d).toLocaleDateString('en',{month:'short',day:'numeric'});
  } catch { return ''; }
}
function isRecent(d) { try { return d&&(Date.now()-new Date(d).getTime())<7200000; } catch { return false; } }
function stripHtml(s) {
  if(!s) return '';
  return s.replace(/<[^>]*>/g,'').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
}
function cleanTitle(s) { const t=stripHtml(s||''); return t.length>200?t.slice(0,200)+'…':t; }
function cleanSummary(s) { const t=stripHtml(s||''); return t.length>300?t.slice(0,300)+'…':t; }
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeUrl(u) {
  try {
    const parsed=new URL(u, location.href);
    return (parsed.protocol==='http:'||parsed.protocol==='https:')?parsed.href:'';
  } catch { return ''; }
}
function safeStorageSet(key,val) {
  try { localStorage.setItem(key,val); return true; } catch { return false; }
}
function fetchTimeoutSignal(ms) {
  try { return AbortSignal.timeout(ms); } catch {
    const c=new AbortController(); setTimeout(()=>c.abort(),ms); return c.signal;
  }
}
function setStatus(msg,cls='') {
  document.getElementById('statusBar').innerHTML=cls?`<span class="${cls}">${msg}</span>`:msg;
}
function showToast(msg,dur=2500) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),dur);
}
function setBusy(on) {
  isFetching=on; document.getElementById('refreshBtn').disabled=on;
  const ic=document.getElementById('refreshIcon'); ic.className=on?'spin':''; ic.textContent='⟳';
  const pf=document.getElementById('progressFill');
  on?pf.classList.add('indeterminate'):pf.classList.remove('indeterminate');
}

// ── DATA (built server-side by scripts/fetch_news.py → data/news.json) ─────────
let NEWS=null, lastLoad=0;
async function loadNews() {
  const res=await fetch('data/news.json?_='+Date.now(),{cache:'no-store',signal:fetchTimeoutSignal(20000)});
  if(!res.ok) throw new Error(`data/news.json returned HTTP ${res.status}`);
  NEWS=await res.json();
  for(const k of ['rss','official','releases','chapters','sources']) if(!Array.isArray(NEWS[k])) NEWS[k]=[];
  lastLoad=Date.now();
  return NEWS;
}
function limitPerSource(items,n) {
  const seen={}; return items.filter(a=>(seen[a.source]=(seen[a.source]||0)+1)<=n);
}
function itemsForMode() {
  if(!NEWS) return [];
  let list;
  if(mode==='rss') list=limitPerSource(NEWS.rss||[],cfg.perFeed);
  else if(mode==='official') list=limitPerSource(NEWS.official||[],cfg.perFeed);
  else if(mode==='releases') list=NEWS.releases||[];
  else if(mode==='chapters') list=NEWS.chapters||[];
  else list=[];
  return list.map(a=>({...a,age:timeAgo(a.pubDate)+(a.stale?' · cached':'')}));
}
function showHealth() {
  const el=document.getElementById('health'); if(!el||!NEWS) return;
  const type=mode==='rss'?'rss':mode;
  const src=(NEWS.sources||[]).filter(s=>s.type===type);
  const bad=src.filter(s=>s.status!=='ok');
  if(!bad.length){ el.className='health'; el.innerHTML=''; return; }
  const allBad=bad.length===src.length;
  el.className='health show'+(allBad?' bad':'');
  const lis=bad.slice(0,40).map(s=>`<li><b>${escHtml(s.name)}</b> — ${escHtml(s.status)}${s.error?': '+escHtml(s.error):''}${s.stale?' (showing older posts)':''}</li>`).join('');
  el.innerHTML=`⚠ ${bad.length} of ${src.length} sources had problems — tap for details<ul>${lis}</ul>`;
}
function showMode() {
  allArticles=itemsForMode(); showHealth();
  const gen=NEWS&&NEWS.generated_at?timeAgo(NEWS.generated_at):'';
  const label=mode==='rss'?'articles':mode==='chapters'?'chapters':'posts';
  const ageMin=NEWS&&NEWS.generated_at?(Date.now()-new Date(NEWS.generated_at).getTime())/60000:null;
  if(ageMin===null) setStatus('No data yet — the first update has not run','err');
  else if(ageMin>240) setStatus(`⚠ ${allArticles.length} ${label} — data is ${Math.round(ageMin/60)}h old, waiting for the next update`,'err');
  else setStatus(`✓ ${allArticles.length} ${label}${gen?` — updated ${gen}`:''}`,'ok');
  visibleCount=PAGE_SIZE; applyFilter();
}

// ── MAIN FETCH ────────────────────────────────────────────────────────────────
async function fetchCurrent() {
  if(isFetching) return;
  setBusy(true);
  try { await loadNews(); showMode(); }
  catch(e) { setStatus(`Error: ${escHtml(e.message)}`,'err'); }
  finally { setBusy(false); }
}

// ── FILTER + RENDER ───────────────────────────────────────────────────────────
function applyFilter() {
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const pool=cat==='fav'?favorites:allArticles;
  filteredPool=pool.filter(a=>{
    if(cat!=='all'&&cat!=='fav'&&a.cat!==cat) return false;
    if(cfg.hideRead&&readLinks.has(a.link)) return false;
    if(q&&!a.title.toLowerCase().includes(q)&&
         !(a.source||'').toLowerCase().includes(q)&&
         !(a.summary||'').toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById('countBadge').textContent=filteredPool.length+' posts';
  updateCounts();
  renderArticles(filteredPool.slice(0,visibleCount));
  document.getElementById('loadMoreWrap').style.display=filteredPool.length>visibleCount?'block':'none';
}

function loadMore() {
  visibleCount+=PAGE_SIZE;
  renderArticles(filteredPool.slice(0,visibleCount));
  document.getElementById('loadMoreWrap').style.display=filteredPool.length>visibleCount?'block':'none';
}

function updateCounts() {
  const c={all:0,anime:0,manga:0,gaming:0};
  allArticles.forEach(a=>{ c.all++; if(a.cat in c) c[a.cat]++; });
  ['all','anime','manga','gaming'].forEach(k=>{ const el=document.getElementById(`cnt-${k}`); if(el) el.textContent=c[k]||''; });
  const fe=document.getElementById('cnt-fav'); if(fe) fe.textContent=favorites.length||'';
}

function renderArticles(items) {
  const el=document.getElementById('articles');
  if(!items.length) {
    el.innerHTML=`<div class="empty">
      <div class="big">${cat==='fav'?'⭐':'📭'}</div>
      <p>${cat==='fav'?'No saved articles yet.<br>Tap ☆ on any article to save it.':'No articles found.<br>Tap ⟳ Refresh to load latest news.'}</p>
    </div>`;
    return;
  }
  el.innerHTML=items.map((a,i)=>{
    const isRead=readLinks.has(a.link);
    const isFav=favorites.some(f=>f.link===a.link);
    const tagCls=a.cat==='anime'?'tag-anime':a.cat==='manga'?'tag-manga':'tag-gaming';
    const newBadge=a.type==='rss'&&isRecent(a.pubDate)?`<span class="new-badge">NEW</span>`:'';
    const flairPart=a.flair?`<span class="tag-flair">${escHtml(a.flair)}</span>`:'';
    const readDot=isRead?`<span class="read-dot">✓</span>`:'';
    const thumbPart=cfg.showThumbs&&a.thumb?`<img class="card-thumb" src="${escHtml(a.thumb)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
    return `<div class="card${isRead?' is-read':''}" data-idx="${i}" onclick="openCard(${i})">
      <div class="card-inner">
        ${thumbPart}
        <div class="card-body">
          <div class="card-meta">
            <span class="source-tag ${tagCls}">${escHtml(a.source)}</span>
            ${newBadge}${flairPart}${readDot}
            <span class="card-age">${a.age}</span>
          </div>
          <div class="card-title">${escHtml(a.title)}</div>
          ${a.summary?`<div class="card-summary">${escHtml(a.summary)}</div>`:''}
          <div class="card-actions" onclick="event.stopPropagation()">
            <button class="action-btn${isFav?' fav-active':''}" onclick="toggleFav(${i})">${isFav?'★ Saved':'☆ Save'}</button>
            <button class="action-btn" onclick="sharePost(${i})">📤 Share</button>
            <button class="action-btn" onclick="copyPost(${i})">📋 Copy</button>
            ${a.link?`<a class="action-btn" href="${escHtml(a.link)}" target="_blank" rel="noopener noreferrer">🔗 Open</a>`:''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── CARD ACTIONS ──────────────────────────────────────────────────────────────
function getRendered() { return filteredPool.slice(0,visibleCount); }

function openCard(idx) {
  const a=getRendered()[idx]; if(!a||!a.link) return;
  window.open(a.link,'_blank','noopener noreferrer');
  readLinks.add(a.link);
  safeStorageSet('9ty5_read',JSON.stringify([...readLinks]));
  const card=document.querySelector(`.card[data-idx="${idx}"]`);
  if(card) card.classList.add('is-read');
}
function toggleFav(idx) {
  const a=getRendered()[idx]; if(!a) return;
  const fi=favorites.findIndex(f=>f.link===a.link);
  if(fi>-1){favorites.splice(fi,1);showToast('Removed from saved');}
  else{favorites.unshift(a);showToast('⭐ Saved!');}
  safeStorageSet('9ty5_favs',JSON.stringify(favorites));
  updateCounts(); renderArticles(getRendered());
}
function sharePost(idx) {
  const a=getRendered()[idx]; if(!a) return;
  if(navigator.share){navigator.share({title:a.title,text:a.summary||a.title,url:a.link}).catch(()=>{});}
  else copyPost(idx);
}
function copyPost(idx) {
  const a=getRendered()[idx]; if(!a) return;
  const text=`${a.title}\n\n${a.summary?a.summary+'\n\n':''}Read more: ${a.link}\n\nvia ${a.source} | 9ty5 News`;
  navigator.clipboard.writeText(text).then(()=>showToast('✓ Copied!')).catch(()=>{
    const el=Object.assign(document.createElement('textarea'),{value:text});
    Object.assign(el.style,{position:'fixed',opacity:'0'});
    document.body.appendChild(el); el.select(); document.execCommand('copy');
    document.body.removeChild(el); showToast('✓ Copied!');
  });
}
function markAllRead() {
  const r=getRendered(); r.forEach(a=>readLinks.add(a.link));
  safeStorageSet('9ty5_read',JSON.stringify([...readLinks]));
  renderArticles(r); showToast(`✓ Marked ${r.length} as read`);
}

// ── MODE / CAT / SORT ─────────────────────────────────────────────────────────
function switchMode(m) {
  if(isFetching) return;
  mode=m;
  document.getElementById('modeRss').className='mode-btn'+(m==='rss'?' active-rss':'');
  document.getElementById('modeX').className='mode-btn'+(m==='official'?' active-official':'');
  document.getElementById('modeChapters').className='mode-btn'+(m==='chapters'?' active-chapters':'');
  document.getElementById('modeReleases').className='mode-btn'+(m==='releases'?' active-releases':'');
  if(NEWS) showMode(); else fetchCurrent();
}
function switchCat(btn,c) {
  cat=c;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  visibleCount=PAGE_SIZE; applyFilter();
}

// ── SETTINGS ──────────────────────────────────────────────────────────────────
function saveCfg() { safeStorageSet('9ty5_cfg',JSON.stringify(cfg)); }
function openSettings()  { document.getElementById('settingsOverlay').classList.add('open'); document.getElementById('settingsPanel').classList.add('open'); }
function closeSettings() { document.getElementById('settingsOverlay').classList.remove('open'); document.getElementById('settingsPanel').classList.remove('open'); }
function setAutoRefresh(mins,btn) {
  document.querySelectorAll('#arOpts .s-opt').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); cfg.autoRefresh=mins; saveCfg(); setupAutoRefresh();
}
function setPerFeed(n,btn) {
  document.querySelectorAll('#pfOpts .s-opt').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); cfg.perFeed=n; saveCfg();
}
function toggleSetting(key) {
  cfg[key]=!cfg[key]; saveCfg();
  if(key==='hideRead'){document.getElementById('hideReadToggle').classList.toggle('on',cfg.hideRead); applyFilter();}
  if(key==='showThumbs'){document.getElementById('thumbToggle').classList.toggle('on',cfg.showThumbs); renderArticles(getRendered());}
}
function setupAutoRefresh() {
  clearInterval(arTimer);
  const badge=document.getElementById('autoBadge');
  if(cfg.autoRefresh>0){
    badge.style.display='inline'; badge.textContent=`⟳ ${cfg.autoRefresh}m`;
    arTimer=setInterval(()=>{ if(!isFetching) fetchCurrent(); },cfg.autoRefresh*60000);
  } else { badge.style.display='none'; }
}
function clearCache() {
  if(!confirm('Clear all cached articles and saved items?')) return;
  ['9ty5_favs','9ty5_read'].forEach(k=>localStorage.removeItem(k));
  favorites=[]; readLinks=new Set(); allArticles=[]; filteredPool=[];
  updateCounts(); document.getElementById('articles').innerHTML='';
  closeSettings(); showToast('Cache cleared');
}
function applySettingsToUI() {
  document.getElementById('hideReadToggle').classList.toggle('on',cfg.hideRead);
  document.getElementById('thumbToggle').classList.toggle('on',cfg.showThumbs);
  const arVals=[0,5,15,30];
  document.querySelectorAll('#arOpts .s-opt').forEach((b,i)=>b.classList.toggle('active',arVals[i]===cfg.autoRefresh));
  const pfVals=[5,8,12];
  document.querySelectorAll('#pfOpts .s-opt').forEach((b,i)=>b.classList.toggle('active',pfVals[i]===cfg.perFeed));
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function init() {
  // drop data saved by older versions of this page (Reddit, My Feed, old article caches)
  ['9ty5_reddit_cache','9ty5_reddit_cache_ts','9ty5_custom_subs','9ty5_rss_cache','9ty5_rss_cache_ts']
    .forEach(k=>{ try{ localStorage.removeItem(k); }catch{} });
  updateCounts(); applySettingsToUI(); setupAutoRefresh();
  fetchCurrent();
  // pull fresh data when the person comes back to the tab or app
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&!isFetching&&Date.now()-lastLoad>10*60000) fetchCurrent();
  });
}
init();
</script>

<script>
if('serviceWorker' in navigator){
  // when a new service worker takes over, reload once so the page and data are the new version
  const hadController=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController&&!reloaded){ reloaded=true; location.reload(); } });
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
}
</script>
